name: Build Coin Rush AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found ZIP: $ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find extracted -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find extracted -type f | head -200
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project directory: $ANDROID_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check project
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "Android project:"
          pwd

          echo "Files:"
          ls -la

          echo "Gradle version:"
          gradle --version

      - name: Build Release AAB
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle bundleRelease --no-daemon

      - name: Find AAB
        shell: bash
        run: |
          set -e

          echo "Searching for AAB..."

          find "$ANDROID_DIR" \
            -type f \
            -name "*.aab" \
            -print

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: coin-rush-release-aab
          path: |
            ${{ env.ANDROID_DIR }}/**/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: coin-rush-debug-apk
          path: |
            ${{ env.ANDROID_DIR }}/**/outputs/apk/debug/*.apk
          if-no-files-found: warn
