name: Build Coin Rush AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          echo "Extracted project:"
          find extracted -maxdepth 3 -type f | sort

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        run: |
          ANDROID_DIR=$(find extracted -type f -name "gradlew" -print -quit | xargs -r dirname)
          if [ -z "$ANDROID_DIR" ]; then
            ANDROID_DIR=$(find extracted -type f -name "settings.gradle*" -print -quit | xargs -r dirname)
          fi
          if [ -z "$ANDROID_DIR" ]; then
            echo "Android Gradle project not found"
            find extracted -maxdepth 4 -type f | sort
            exit 1
          fi
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project: $ANDROID_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew
        working-directory: ${{ env.ANDROID_DIR }}

      - name: Build Release AAB
        run: ./gradlew bundleRelease
        working-directory: ${{ env.ANDROID_DIR }}

      - name: Find AAB
        run: |
          AAB=$(find "$ANDROID_DIR" -type f -name "*.aab" -print -quit)
          if [ -z "$AAB" ]; then
            echo "AAB not found"
            exit 1
          fi
          echo "AAB=$AAB" >> "$GITHUB_ENV"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: coin-rush-release-aab
          path: ${{ env.AAB }}
