name: Build Coin Rush AAB

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)
          echo "ZIP=$ZIP" >> $GITHUB_ENV
          echo "Found ZIP: $ZIP"

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted
          echo "Extracted project:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Release AAB
        working-directory: extracted/android
        run: |
          gradle bundleRelease --no-daemon

      - name: Find AAB
        run: |
          find extracted/android -type f -name "*.aab" -print

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: coin-rush-release-aab
          path: extracted/android/**/outputs/bundle/release/*.aab
